<script>
// Cloudflare Worker：每次開啟網站送出一次 POST，回傳最新累積次數。
const COUNTER_API = 'https://qcc-dialysis-counter.xd821225.workers.dev/visit';
async function updateViewCount() {
  const el = document.getElementById('view-count');
  try {
    const response = await fetch(COUNTER_API, {method: 'POST', cache: 'no-store'});
    if (!response.ok) throw new Error('Counter service unavailable');
    const data = await response.json();
    if (!Number.isSafeInteger(data.total) || data.total < 0) throw new Error('Invalid count');
    el.textContent = data.total.toLocaleString('zh-TW') + ' 次';
  } catch (error) {
    el.textContent = '暫時無法顯示';
  }
}
updateViewCount();

const source = new URLSearchParams(location.search).get('utm_source') === 'qrcode' ? 'qrcode' : 'other';
if (source === 'qrcode') sessionStorage.setItem('qcc_entry_source', 'qrcode');
